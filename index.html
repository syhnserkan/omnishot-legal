<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omnishot — Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0c;
      --card:    #15151a;
      --border:  rgba(255,255,255,0.08);
      --muted:   rgba(255,255,255,0.55);
      --faint:   rgba(255,255,255,0.35);
      --yellow:  #f5d547;
      --orange:  #ffb648;
      --pink:    #e63b7a;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .logo-mark {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--yellow), var(--orange), var(--pink));
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin: 0 auto 24px;
      box-shadow: 0 0 40px rgba(230,59,122,0.35);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      background: linear-gradient(135deg, var(--yellow), var(--orange), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      margin-top: 8px;
    }

    .cards {
      display: flex;
      gap: 16px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 32px;
      width: 220px;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.2s, transform 0.2s;
      text-align: center;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-3px);
    }

    .card-icon {
      font-size: 30px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    footer {
      margin-top: 60px;
      color: var(--faint);
      font-size: 12px;
      text-align: center;
    }

    .lang-toggle {
      position: fixed;
      top: 20px; right: 20px;
      display: flex; gap: 4px;
    }

    .lang-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s, border-color 0.2s;
    }

    .lang-btn.active {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')" id="btn-en">EN</button>
    <button class="lang-btn" onclick="setLang('tr')" id="btn-tr">TR</button>
  </div>

  <div class="logo-mark">⬡</div>
  <h1>Omnishot</h1>
  <p class="subtitle" id="subtitle">Legal Documents</p>

  <div class="cards">
    <a class="card" href="privacy.html" id="card-privacy">
      <div class="card-icon">🔒</div>
      <div class="card-title" id="pp-title">Privacy Policy</div>
      <div class="card-desc" id="pp-desc">How we handle your data</div>
    </a>
    <a class="card" href="terms.html" id="card-terms">
      <div class="card-icon">📋</div>
      <div class="card-title" id="tos-title">Terms of Service</div>
      <div class="card-desc" id="tos-desc">Rules for using Omnishot</div>
    </a>
  </div>

  <footer id="footer">© 2026 Omnishot. All rights reserved.</footer>

  <script>
    const strings = {
      en: {
        subtitle: "Legal Documents",
        ppTitle: "Privacy Policy",
        ppDesc: "How we handle your data",
        tosTitle: "Terms of Service",
        tosDesc: "Rules for using Omnishot",
        footer: "© 2026 Omnishot. All rights reserved."
      },
      tr: {
        subtitle: "Yasal Belgeler",
        ppTitle: "Gizlilik Politikası",
        ppDesc: "Verilerinizi nasıl işliyoruz",
        tosTitle: "Kullanım Koşulları",
        tosDesc: "Omnishot kullanım kuralları",
        footer: "© 2026 Omnishot. Tüm hakları saklıdır."
      }
    };

    function setLang(lang) {
      const s = strings[lang];
      document.getElementById('subtitle').textContent = s.subtitle;
      document.getElementById('pp-title').textContent = s.ppTitle;
      document.getElementById('pp-desc').textContent = s.ppDesc;
      document.getElementById('tos-title').textContent = s.tosTitle;
      document.getElementById('tos-desc').textContent = s.tosDesc;
      document.getElementById('footer').textContent = s.footer;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
      // Pass lang param to child pages via href
      document.getElementById('card-privacy').href = 'privacy.html?lang=' + lang;
      document.getElementById('card-terms').href = 'terms.html?lang=' + lang;
    }

    // Detect browser language
    const browserLang = navigator.language.startsWith('tr') ? 'tr' : 'en';
    setLang(browserLang);
  </script>

</body>
</html>
